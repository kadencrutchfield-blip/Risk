<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1726">
<title>Overrun</title>
<meta name="description" content="A turn-based conquest game you play with friends over text.">
<meta property="og:title" content="Overrun — it's your move!">
<meta property="og:description" content="Tap to take your turn in our game of Overrun.">
<meta property="og:image" content="https://kadencrutchfield-blip.github.io/Risk/preview.jpg">
<meta property="og:type" content="website">
<style>
:root{
  --bg:#0e1726; --bg2:#16233a; --bg3:#1f3150; --line:#2c4268;
  --text:#eef3fb; --muted:#9fb1cc; --accent:#ffd166; --danger:#ff6b6b;
  --water1:#1d4e7a; --water2:#123657;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;border:0;cursor:pointer}
#top{display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:var(--bg2);border-bottom:1px solid var(--line)}
#top h1{font-size:18px;margin:0;letter-spacing:.5px;font-weight:800}
#top h1 span{color:var(--accent)}
#turninfo{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0}
#turninfo b{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:var(--bg3);border-radius:10px;padding:7px 11px;font-size:14px;font-weight:600}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
main{flex:1;display:flex;flex-direction:column;max-width:900px;width:100%;margin:0 auto}
#mapbox{position:relative;margin:8px 8px 0}
#mapwrap{overflow:auto;border-radius:14px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#mapinner{position:relative;width:100%}
#mapwrap.zoom{max-height:62vh}
#mapwrap.zoom #mapinner{width:210%}
#map{position:relative;width:100%;height:auto;display:block;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#mapbg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;will-change:transform;contain:strict}
.zoombtn{position:absolute;right:8px;top:8px;background:rgba(10,16,28,.75);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700;z-index:2;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#map .t{cursor:pointer}
#map .t polygon{stroke-width:.8;transition:opacity .15s}
#map .t{transition:opacity .15s}
#map .t circle.pl{stroke-width:1}
#map .lane{stroke:#cfe3ff;stroke-opacity:.5;stroke-width:1.6;stroke-dasharray:3 4;stroke-linecap:round}
#map .lane.in{stroke-opacity:.28}
#map .lbl,#mapbg .lbl{fill:#fff;fill-opacity:.55;font-size:7.5px;font-weight:800;letter-spacing:1px;text-anchor:middle;pointer-events:none}
#map .lbl.sys,#mapbg .lbl.sys{font-size:6.5px;letter-spacing:.5px}
#map .spin{transform-box:fill-box;transform-origin:center;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#map .t.dim{opacity:.38}
#map .ol{fill:none;stroke:transparent;stroke-width:3;stroke-linecap:round;pointer-events:none}
#map .ol.sel{stroke:#fff;stroke-width:3.5}
#map .ol.tgt{stroke:var(--accent);stroke-width:3;stroke-dasharray:4 3;animation:dash 0.8s linear infinite}
#map .ol.ok{stroke:#9ff5c0;stroke-width:2.5;stroke-dasharray:4 3;animation:dash 0.8s linear infinite}
#map .ol.hit{stroke:var(--danger);stroke-width:4}
@keyframes dash{to{stroke-dashoffset:-14}}
#map .badge{pointer-events:none}
#map .badge circle{fill:rgba(10,16,28,.82);stroke-width:1.6}
#map .badge text{fill:#fff;font-weight:800;font-size:11px;text-anchor:middle;dominant-baseline:central}
#map .nm{pointer-events:none;fill:#fff;font-size:7px;font-weight:700;text-anchor:middle;paint-order:stroke;stroke:rgba(0,0,0,.75);stroke-width:2px}
#map.nonames .nm{display:none}
#map .pop{animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
#panel{margin:10px 8px 0;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
#panel .ph{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700}
#panel .msg{margin:4px 0 10px;font-size:15px}
#panel .msg b{color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--bg3);border-radius:12px;padding:11px 14px;font-weight:700;flex:1 1 auto;min-width:0;text-align:center}
.btn.primary{background:var(--accent);color:#1b1300}
.btn.red{background:#e5484d;color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.steps{display:flex;gap:4px;margin:6px 0 2px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--bg3)}
.steps i.on{background:var(--accent)}
.dice{display:flex;align-items:center;gap:6px;margin:0 0 10px;flex-wrap:wrap}
.die{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;font-weight:800;font-size:16px}
.die.a{background:#e5484d;color:#fff}.die.d{background:#f1f4f9;color:#16233a}
.die.lose{opacity:.35}
.dice .vs{color:var(--muted);font-size:12px;margin:0 4px}
#players{display:flex;gap:6px;flex-wrap:wrap;margin:10px 8px 16px}
.pchip{display:flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:5px 10px 5px 7px;font-size:13px}
.pchip.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.pchip.out{opacity:.4;text-decoration:line-through}
.pchip small{color:var(--muted)}
#overlay{position:fixed;inset:0;background:rgba(5,9,16,.72);display:flex;align-items:flex-end;justify-content:center;z-index:10;padding:16px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#overlay[hidden]{display:none}
.sheet{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:20px 18px;width:100%;max-width:480px;max-height:88dvh;overflow:auto;margin-bottom:env(safe-area-inset-bottom)}
@media(min-width:700px){#overlay{align-items:center}}
.sheet h2{margin:0 0 6px;font-size:22px}
.sheet h3{margin:16px 0 6px;font-size:15px;color:var(--accent)}
.sheet p{margin:6px 0;color:var(--muted)}
.sheet .big{font-size:44px;font-weight:800;text-align:center;margin:6px 0}
.sheet input[type=text]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--text);font:inherit;font-size:16px}
.sheet input[type=range]{width:100%;accent-color:var(--accent)}
.prow{display:flex;gap:8px;align-items:center;margin:8px 0}
.prow .x{background:transparent;color:var(--muted);font-size:20px;padding:4px 8px}
.log{list-style:none;padding:0;margin:8px 0;font-size:14px}
.log li{padding:6px 0;border-bottom:1px solid var(--line)}
.log li:last-child{border:0}
.log .tn{color:var(--muted);font-size:12px;margin-right:6px}
.pn{font-weight:800}
.cards{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.cardx{width:56px;height:76px;border-radius:10px;background:linear-gradient(160deg,#2a426b,#1a2b48);border:1px solid #3d5a8a;display:grid;place-items:center;font-size:26px}
.cardx small{display:block;font-size:10px;color:var(--muted);text-align:center}
.cardx.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.rules li{margin:4px 0;color:var(--muted)}
.rules b{color:var(--text)}
table.reg{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
table.reg td{padding:5px 2px;border-bottom:1px solid var(--line)}
table.reg td:last-child{text-align:right;color:var(--accent);font-weight:700}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%) translateY(-20px);background:#000c;color:#fff;padding:9px 14px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.menu .btn{display:block;width:100%;margin:6px 0;text-align:left}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
.seg{display:flex;flex-wrap:wrap;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1 1 40%;background:transparent;border-radius:9px;padding:9px 6px;font-weight:700;color:var(--muted);font-size:14px}
.seg button.on{background:var(--bg3);color:var(--text);box-shadow:0 0 0 1px var(--line)}
</style>
</head>
<body>
<header id="top">
  <h1>OVER<span>RUN</span></h1>
  <div id="turninfo"></div>
  <button class="iconbtn" id="zoomBtn" aria-label="Zoom map">🔍</button>
  <button class="iconbtn" id="menuBtn" aria-label="Menu">☰</button>
</header>
<main>
  <div id="mapbox"><div id="mapwrap"><div id="mapinner"><svg id="mapbg" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg><svg id="map" xmlns="http://www.w3.org/2000/svg"></svg></div></div></div>
  <section id="panel"></section>
  <div id="players"></div>
</main>
<div id="overlay" hidden><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script src="game.js"></script>
</body>
</html>
